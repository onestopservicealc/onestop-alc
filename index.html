<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ศูนย์รวมระบบสำนักงานคณะกรรมการควบคุมเครื่องดื่มแอลกอฮอล์</title>
<meta name="theme-color" content="#e8112d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f5f8;
    --white:#ffffff;
    --ink:#16161c;
    --ink-soft:#54545f;
    --muted:#9a9aa6;
    --line:#ececef;
    --red:#e8112d;
    --red-soft:#ff3b52;
    --red-tint:#ffe7ea;
    --red-wash:#fff3f4;
    --shadow-sm:0 4px 14px -6px rgba(22,22,28,.16);
    --shadow-md:0 18px 40px -18px rgba(22,22,28,.28);
    --shadow-red:0 20px 46px -18px rgba(232,17,45,.45);
    --gutter:clamp(12px,3.5vw,24px);
    --r-card:clamp(22px,5vw,30px);
    --r-pill:999px;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Thai',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    -webkit-tap-highlight-color:rgba(232,17,45,.12);
  }
  a{color:var(--red);text-decoration:none}

  /* ---------- ambient rounded blobs ---------- */
  .blob{position:fixed;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.55}
  .blob.a{width:min(520px,120vw);height:min(520px,120vw);top:-200px;right:-120px;
    background:radial-gradient(circle,var(--red-tint),transparent 70%);
    animation:float1 20s ease-in-out infinite}
  .blob.b{width:min(460px,110vw);height:min(460px,110vw);bottom:-180px;left:-120px;
    background:radial-gradient(circle,#eef1ff,transparent 70%);
    animation:float2 24s ease-in-out infinite}
  .blob.c{width:min(300px,80vw);height:min(300px,80vw);top:40%;left:60%;
    background:radial-gradient(circle,var(--red-wash),transparent 70%);
    animation:float1 28s ease-in-out infinite reverse}
  @keyframes float1{50%{transform:translate(-60px,50px) scale(1.12)}}
  @keyframes float2{50%{transform:translate(70px,-50px) scale(1.1)}}

  /* ---------- พื้นหลังขยับเบา ๆ (CSS ล้วน ไม่มี JS ไม่มีไลบรารี) ----------
     ทุกชิ้นใช้ transform/opacity เท่านั้น = การ์ดจอวาดให้ ไม่กิน CPU
     และหยุดเองถ้าเครื่องตั้ง "ลดการเคลื่อนไหว" (บล็อกท้ายไฟล์) */
  .bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}

  /* ตารางจุดไหลเฉียงช้า ๆ — วนไร้รอยต่อเพราะระยะเลื่อน = ขนาดกระเบื้องพอดี (26px) */
  .bg .dots{
    position:absolute;inset:-40px;
    background-image:radial-gradient(rgba(22,22,28,.11) 1.15px,transparent 1.15px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(115% 95% at 50% 35%,#000 35%,transparent 82%);
            mask-image:radial-gradient(115% 95% at 50% 35%,#000 35%,transparent 82%);
    animation:drift 18s linear infinite;
    will-change:transform;
  }
  @keyframes drift{to{transform:translate3d(-26px,-26px,0)}}

  /* ฝุ่นลอยขึ้นจากขอบล่าง จางหัว-จางท้าย */
  .bg .dust{
    position:absolute;bottom:-14px;width:7px;height:7px;border-radius:50%;
    background:var(--red-soft);opacity:0;
    animation:rise linear infinite;will-change:transform,opacity;
  }
  @keyframes rise{
    0%{transform:translate3d(0,0,0) scale(.7);opacity:0}
    12%{opacity:.42}
    70%{opacity:.28}
    100%{transform:translate3d(26px,-88vh,0) scale(1.05);opacity:0}
  }
  /* animation-delay ติดลบ = เม็ดกระจายกันตั้งแต่วินาทีแรก ไม่ลอยพร้อมกันเป็นแถว
     คาบเวลาเลขไม่ลงตัวกัน (22..41) = ไม่มาบรรจบเป็นจังหวะซ้ำให้จับได้ */
  .bg .d1 {left:4%;  animation-duration:26s;animation-delay:-2s}
  .bg .d2 {left:10%; animation-duration:34s;animation-delay:-11s;width:5px;height:5px;background:#8fa4ff}
  .bg .d3 {left:16%; animation-duration:29s;animation-delay:-19s;width:6px;height:6px}
  .bg .d4 {left:22%; animation-duration:38s;animation-delay:-6s;width:9px;height:9px}
  .bg .d5 {left:28%; animation-duration:31s;animation-delay:-24s;width:5px;height:5px;background:#8fa4ff}
  .bg .d6 {left:34%; animation-duration:24s;animation-delay:-14s}
  .bg .d7 {left:39%; animation-duration:36s;animation-delay:-30s;width:8px;height:8px;background:#8fa4ff}
  .bg .d8 {left:45%; animation-duration:27s;animation-delay:-4s;width:6px;height:6px}
  .bg .d9 {left:51%; animation-duration:41s;animation-delay:-17s;width:10px;height:10px}
  .bg .d10{left:57%; animation-duration:23s;animation-delay:-9s;width:5px;height:5px}
  .bg .d11{left:63%; animation-duration:33s;animation-delay:-27s;width:7px;height:7px;background:#8fa4ff}
  .bg .d12{left:69%; animation-duration:28s;animation-delay:-21s;width:6px;height:6px}
  .bg .d13{left:75%; animation-duration:39s;animation-delay:-12s;width:9px;height:9px}
  .bg .d14{left:81%; animation-duration:22s;animation-delay:-33s;width:5px;height:5px;background:#8fa4ff}
  .bg .d15{left:87%; animation-duration:35s;animation-delay:-7s;width:7px;height:7px}
  .bg .d16{left:93%; animation-duration:30s;animation-delay:-25s;width:6px;height:6px}
  /* จอเล็ก = เหลือ 10 เม็ด ไม่ให้แบตหมดเร็วและไม่รกจอแคบ */
  @media (max-width:640px){
    .bg .d2,.bg .d5,.bg .d8,.bg .d11,.bg .d14,.bg .d16{display:none}
  }

  .shell{
    position:relative;z-index:2;max-width:1240px;margin:0 auto;
    padding:0 var(--gutter) calc(clamp(40px,12vw,80px) + env(safe-area-inset-bottom));
  }

  /* ---------- sticky top region (bar + chips) ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    margin:0 calc(-1 * var(--gutter));
    padding:calc(env(safe-area-inset-top) + clamp(10px,2.5vw,22px)) var(--gutter) 12px;
    background:rgba(244,245,248,.86);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }

  header.bar{
    display:flex;align-items:center;gap:clamp(10px,2vw,20px);flex-wrap:wrap;
    padding:clamp(10px,2vw,16px) clamp(14px,2.4vw,26px);
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--white);
    border-radius:clamp(22px,6vw,999px);
    box-shadow:var(--shadow-sm);
    animation:reveal .75s cubic-bezier(.2,.7,.3,1) both;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto}
  .emblem{
    width:clamp(42px,10.5vw,52px);height:clamp(42px,10.5vw,52px);flex:none;
    border-radius:50%;background:var(--white);display:grid;place-items:center;overflow:hidden;
    box-shadow:0 6px 18px -8px rgba(232,17,45,.5);
  }
  .emblem img{width:100%;height:100%;object-fit:contain;display:block;border-radius:50%}
  .brand-txt{min-width:0}
  .brand-txt h1{font-family:'Kanit',sans-serif;font-weight:700;font-size:clamp(16px,4.4vw,19px);
    letter-spacing:.3px;line-height:1.15;white-space:nowrap}
  .brand-txt p{font-family:'Space Mono',monospace;font-size:clamp(9px,2.4vw,11px);letter-spacing:3px;
    color:var(--red);text-transform:uppercase;white-space:nowrap}

  /* ---------- header search ---------- */
  .search{flex:1 1 240px;min-width:0;position:relative;display:flex;align-items:center;order:3}
  .search svg{position:absolute;left:17px;width:17px;height:17px;stroke:var(--muted);pointer-events:none}
  .search input{
    width:100%;height:48px;background:var(--paper);border:2px solid transparent;color:var(--ink);
    padding:0 16px 0 44px;font-family:'IBM Plex Sans Thai',sans-serif;font-size:16px;outline:none;
    border-radius:var(--r-pill);transition:border-color .25s,background .25s;-webkit-appearance:none;
  }
  .search input:focus{border-color:var(--red);background:var(--white)}
  .search input::placeholder{color:var(--muted)}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none}

  /* ---------- compact meta (count · date · clock) ---------- */
  .meta{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto;
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;color:var(--muted);white-space:nowrap}
  .meta .count{color:var(--ink)}
  .meta .sep{color:var(--line)}
  .meta .date{color:var(--ink-soft)}
  .live{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;
    border-radius:var(--r-pill);padding:7px 14px;font-size:12.5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red-soft);animation:ping 1.8s ease-out infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,59,82,.7)}70%{box-shadow:0 0 0 9px rgba(255,59,82,0)}100%{box-shadow:0 0 0 0 rgba(255,59,82,0)}}

  /* ---------- filter chips (horizontal scroll on mobile) ---------- */
  .chips{
    display:flex;gap:9px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    padding:14px var(--gutter) 4px;margin:0 calc(-1 * var(--gutter));
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;font-family:'IBM Plex Sans Thai',sans-serif;font-size:14.5px;font-weight:500;
    color:var(--ink-soft);background:var(--white);border:2px solid transparent;
    padding:0 20px;height:42px;cursor:pointer;transition:all .22s;
    border-radius:var(--r-pill);box-shadow:var(--shadow-sm);white-space:nowrap;
  }
  .chip:hover{transform:translateY(-2px)}
  .chip.on{background:var(--ink);color:#fff}

  /* ---------- install banner (PWA) ---------- */
  .install{
    display:flex;align-items:center;gap:14px;margin:6px 0 16px;padding:14px 18px;
    background:var(--ink);color:#fff;border-radius:22px;box-shadow:var(--shadow-md);
  }
  .install .mark{width:40px;height:40px;flex:none;border-radius:50%;background:var(--white);
    display:grid;place-items:center;overflow:hidden}
  .install .mark img{width:100%;height:100%;object-fit:contain;display:block;border-radius:50%}
  .install .txt{flex:1;min-width:0}
  .install .txt b{display:block;font-family:'Kanit',sans-serif;font-weight:600;font-size:15px}
  .install .txt span{font-size:12.5px;color:var(--muted)}
  .install .yes{flex:none;height:44px;padding:0 20px;border:none;cursor:pointer;
    background:#fff;color:var(--ink);border-radius:var(--r-pill);
    font-family:'Kanit',sans-serif;font-weight:600;font-size:14px;transition:background .2s,color .2s}
  .install .yes:hover{background:var(--red-tint);color:var(--red)}
  .install .no{flex:none;width:44px;height:44px;border:none;cursor:pointer;background:transparent;
    color:var(--muted);border-radius:var(--r-pill);font-size:20px;line-height:1;transition:color .2s}
  .install .no:hover{color:#fff}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,304px),1fr));gap:clamp(12px,2.6vw,20px)}
  /* กล่องครอบการ์ด — ปุ่มดาวต้องอยู่นอก <a> (ห้ามซ้อนปุ่มไว้ในลิงก์)
     และกล่องนี้เป็นตัวรับ order เพื่อดันระบบที่ติดดาวขึ้นไปอยู่ด้านบน */
  .cw{
    position:relative;display:flex;
    transition:transform .3s cubic-bezier(.2,.7,.3,1);
    animation:cardIn .55s cubic-bezier(.2,.7,.3,1) both;
  }
  .cw:hover{transform:translateY(-6px)}
  .cw:active{transform:scale(.985)}
  .cw:hover .card{box-shadow:var(--shadow-md)}
  .card{
    position:relative;width:100%;background:var(--white);border-radius:var(--r-card);
    padding:clamp(18px,4vw,24px);cursor:pointer;text-decoration:none;color:inherit;
    display:flex;flex-direction:column;gap:12px;overflow:hidden;
    box-shadow:var(--shadow-sm);transition:box-shadow .3s;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  /* ---------- ปุ่มติดดาว "ใช้บ่อย" ---------- */
  .fav{
    position:absolute;top:clamp(14px,3vw,18px);right:clamp(14px,3vw,18px);z-index:3;
    width:34px;height:34px;flex:none;display:grid;place-items:center;padding:0;border:none;
    cursor:pointer;border-radius:50%;background:var(--paper);color:var(--muted);
    transition:background .2s,color .2s,transform .2s;
  }
  .fav:hover{background:var(--red-wash);color:var(--red);transform:scale(1.1)}
  .fav svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.9;fill:none}
  .fav.on{background:#fff4d6;color:#e0a100}
  .fav.on svg{fill:currentColor;stroke-width:1.4}
  .fav.on:hover{background:#ffe6a3;color:#c98a00}

  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .icon{position:relative;width:clamp(58px,15vw,68px);height:clamp(58px,15vw,68px);flex:none}
  .icon img{width:100%;height:100%;object-fit:contain;display:block}
  /* ไอคอนเป็นไฟล์ GIF ขยับเองวนไม่หยุด — ไม่ใช้ CSS animation แล้ว
     และขยับทุกเครื่องเสมอ ไม่สนค่า "ลดการเคลื่อนไหว" ของระบบ (ตั้งใจ) */

  /* เว้นที่ให้ปุ่มดาวมุมขวาบน ป้ายหมวดจะไม่ลอดใต้ปุ่ม */
  .tags{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-right:34px}
  .cat-tag{font-size:11.5px;font-weight:600;letter-spacing:.5px;color:var(--red);
    background:var(--red-wash);padding:6px 13px;border-radius:var(--r-pill);white-space:nowrap}
  .internal{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;
    font-size:10px;letter-spacing:.6px;color:var(--ink-soft);background:var(--paper);
    border:1px solid var(--line);padding:5px 11px;border-radius:var(--r-pill);white-space:nowrap}
  .internal i{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}

  .card h3{font-family:'Kanit',sans-serif;font-weight:600;font-size:clamp(18px,4.6vw,20px);
    line-height:1.3;letter-spacing:.2px;text-wrap:pretty}
  .card p{color:var(--ink-soft);font-size:14px;line-height:1.65;flex:1;text-wrap:pretty}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
    min-height:48px;padding-top:12px;border-top:1px solid var(--line)}
  .open-label{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.8px;color:var(--muted)}
  .go{display:flex;align-items:center;gap:8px;color:var(--red);font-family:'Kanit',sans-serif;
    font-weight:600;font-size:15px;letter-spacing:.3px}
  .go svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none}

  .empty{grid-column:1/-1;text-align:center;padding:clamp(44px,12vw,70px) 24px;color:var(--muted);
    background:var(--white);border-radius:var(--r-card);box-shadow:var(--shadow-sm);font-family:'Kanit',sans-serif}
  .empty b{display:block;color:var(--ink-soft);font-size:19px;margin-bottom:6px;font-weight:600}

  footer{
    margin-top:clamp(32px,8vw,60px);padding:18px clamp(18px,3vw,26px);
    background:var(--white);border-radius:clamp(20px,5vw,999px);box-shadow:var(--shadow-sm);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--muted);
  }
  footer .r{color:var(--red)}

  /* ---------- embed viewer (iframe sheet) ---------- */
  .viewer{
    position:fixed;inset:0;z-index:50;display:none;padding:clamp(0px,2vw,18px);
    background:rgba(22,22,28,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .viewer.open{display:flex}
  .viewer-panel{
    margin:auto;width:100%;max-width:1400px;height:100%;
    background:var(--white);border-radius:clamp(0px,3vw,30px);overflow:hidden;
    display:flex;flex-direction:column;box-shadow:var(--shadow-md);
    animation:sheetUp .4s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes sheetUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
  .viewer-bar{display:flex;align-items:center;gap:12px;
    padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;border-bottom:1px solid var(--line)}
  .viewer-bar .vi{width:42px;height:42px;flex:none;display:grid;place-items:center}
  .viewer-bar .vi img{width:100%;height:100%;object-fit:contain;display:block}
  .viewer-bar .vt{line-height:1.25;min-width:0;flex:1}
  .viewer-bar .vt b{display:block;font-family:'Kanit',sans-serif;font-weight:600;font-size:16px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .viewer-bar .vt span{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{flex:none;display:grid;place-items:center;width:46px;height:46px;padding:0;border:none;
    cursor:pointer;text-decoration:none;color:var(--ink);background:var(--paper);
    border-radius:var(--r-pill);transition:background .2s,color .2s}
  .icon-btn:hover{background:var(--red-wash);color:var(--red)}
  .icon-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.2;fill:none}
  .icon-btn.close{color:#fff;background:var(--ink)}
  .icon-btn.close:hover{background:var(--red);color:#fff}
  .viewer-frame{flex:1;position:relative;background:var(--paper)}
  .viewer-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .viewer-load{position:absolute;inset:0;display:grid;place-items:center;
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--muted)}

  @keyframes reveal{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .reveal{animation:reveal .75s cubic-bezier(.2,.7,.3,1) both}

  /* หมายเหตุ: บล็อกนี้คุมได้แค่ animation/transition ของ CSS (blob, cardIn, ping, reveal, sheetUp)
     ไอคอน GIF ไม่ถูกหยุดด้วยค่านี้ — ตั้งใจให้ขยับทุกเครื่อง */
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.05s!important}
  }
</style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="blob c"></div>

  <!-- พื้นหลังขยับเบา ๆ: ตารางจุดไหลเฉียง + ฝุ่นลอยขึ้น (ตกแต่งล้วน) -->
  <div class="bg" aria-hidden="true">
    <span class="dots"></span>
    <span class="dust d1"></span>
    <span class="dust d2"></span>
    <span class="dust d3"></span>
    <span class="dust d4"></span>
    <span class="dust d5"></span>
    <span class="dust d6"></span>
    <span class="dust d7"></span>
    <span class="dust d8"></span>
    <span class="dust d9"></span>
    <span class="dust d10"></span>
    <span class="dust d11"></span>
    <span class="dust d12"></span>
    <span class="dust d13"></span>
    <span class="dust d14"></span>
    <span class="dust d15"></span>
    <span class="dust d16"></span>
  </div>

  <div class="shell">
    <!-- STICKY TOP: bar + chips -->
    <div class="topbar">
      <header class="bar">
        <div class="brand">
          <div class="emblem"><img src="./icons/logo.png" alt="ตราสำนักงานคณะกรรมการควบคุมเครื่องดื่มแอลกอฮอล์ กรมควบคุมโรค" width="52" height="52"></div>
          <div class="brand-txt">
            <h1>ศูนย์รวมระบบ</h1>
            <p>System Hub</p>
          </div>
        </div>

        <label class="search">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke-width="2"/><path d="m20 20-3-3" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" inputmode="search" enterkeyhint="search" placeholder="ค้นหาระบบ..." aria-label="ค้นหาระบบ">
        </label>

        <div class="meta">
          <span><span class="count" id="count">00</span> ระบบ</span>
          <span class="sep">|</span>
          <span class="date" id="date">--</span>
          <span class="live" id="live"><span class="dot"></span><span id="clock">--:--:--</span></span>
        </div>
      </header>

      <div class="chips" id="chips"></div>
    </div>

    <!-- PWA INSTALL BANNER -->
    <div class="install" id="install" hidden>
      <div class="mark"><img src="./icons/logo.png" alt="" width="40" height="40"></div>
      <div class="txt">
        <b>ติดตั้งเป็นแอปบนมือถือ</b>
        <span>เปิดเต็มจอ ไม่ต้องพิมพ์ลิงก์ใหม่ทุกครั้ง</span>
      </div>
      <button class="yes" id="installYes" type="button">ติดตั้ง</button>
      <button class="no" id="installNo" type="button" aria-label="ปิด">×</button>
    </div>

    <!-- GRID -->
    <main class="grid" id="grid"></main>

    <footer class="reveal" style="animation-delay:.2s">
      <span>© ศูนย์รวมระบบหน่วยงาน · จัดทำเพื่อการใช้งานภายใน</span>
      <span>STATUS <span class="r">● ONLINE</span> · v2.0</span>
    </footer>
  </div>

  <!-- EMBED VIEWER -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="viewer-panel">
      <div class="viewer-bar">
        <div class="vi" id="vIcon"></div>
        <div class="vt">
          <b id="vName"></b>
          <span id="vUrl"></span>
        </div>
        <a class="icon-btn" id="vOpen" href="#" target="_blank" rel="noopener" aria-label="เปิดแท็บใหม่" title="เปิดแท็บใหม่">
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <button class="icon-btn close" id="vClose" type="button" aria-label="ปิด" title="ปิด">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="viewer-frame">
        <div class="viewer-load" id="vLoad">กำลังโหลด…</div>
        <iframe id="vFrame" title="ระบบ" allow="clipboard-write; fullscreen"></iframe>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* =========================================================
     ★★★ ตั้งค่าการทำงาน ★★★
     OPEN_MODE      : "embed"  = เปิดระบบที่รองรับไว้ในหน้านี้
                      "newtab" = บังคับให้ทุกระบบเปิดแท็บใหม่
     SHOW_CLOCK     : true/false แสดงนาฬิกาบนแถบด้านบน
     SHOW_INSTALL   : true/false แสดงแถบชวนติดตั้งเป็นแอป (PWA)
     ========================================================= */
  var OPEN_MODE    = "embed";
  var SHOW_CLOCK   = true;
  var SHOW_INSTALL = true;

  /* ไอคอนการ์ดระบบ: GIF ขยับเองวนไม่หยุด เก็บในเครื่อง (ใช้ออฟไลน์ได้)
     - ค่า icon คือชื่อไฟล์ (ไม่ใส่นามสกุล) ต้องมีไฟล์ icons/sys/<icon>.gif
     - ขยับทุกเครื่องเสมอ แม้ผู้ใช้เปิด "ลดการเคลื่อนไหว" ในระบบ (ตั้งใจ)
     - เพิ่ม/เปลี่ยนไอคอน: ใส่ชื่อจาก lordicon.com หมวด wired/lineal แล้วรัน
           bash tools/build-icons.sh
       แล้ว "เปลี่ยนเลข CACHE ใน sw.js" ไม่งั้นเครื่องที่เคยเปิดจะยังเห็นไอคอนเดิม */
  var ICON_DIR = "./icons/sys/";
  var ICON_PX  = 136;   /* ขนาดจริงของไฟล์ */

  /* =========================================================
     ★★★ แก้ไขรายการระบบทั้งหมดได้ที่นี่ (จัดการจากโค้ดเท่านั้น) ★★★
     - เพิ่มระบบ: เพิ่มบรรทัดใหม่ตามรูปแบบด้านล่าง
     - แก้ไข: เปลี่ยนข้อความในบรรทัดที่ต้องการ
     - ลบ: ลบทั้งบรรทัดของระบบนั้นออก
     embed:true    = เปิดฝังในหน้านี้ | ไม่ใส่ = เปิดแท็บใหม่
     internal:true = แสดงป้าย "เครือข่ายภายใน" (เข้าได้เฉพาะในเครือข่ายสำนักงาน
                     และฝังในหน้านี้ไม่ได้เพราะเป็น http บนหน้า https)
     ========================================================= */
  var SYSTEMS = [
    {name:"ปฏิทินสำนักงาน", url:"https://calendar-d.vercel.app/", desc:"ปฏิทินกิจกรรมและกำหนดการของสำนักงาน", cat:"ทั่วไป", icon:"28-calendar", embed:true},
    {name:"ระบบจองรถราชการ", url:"https://book-car-alc.vercel.app/", desc:"จองรถราชการ ตรวจสอบคิว และติดตามสถานะการจอง", cat:"ยานพาหนะ", icon:"861-car-site-4", embed:true},
    {name:"ทะเบียนครุภัณฑ์คอมพิวเตอร์", url:"https://data-com-alc.vercel.app/", desc:"ทะเบียนและข้อมูลครุภัณฑ์คอมพิวเตอร์ของหน่วยงาน", cat:"ครุภัณฑ์", icon:"748-notebook-laptop-ok-approved", embed:true},
    {name:"ระบบยืม-คืนครุภัณฑ์", url:"http://10.100.31.31/eborrow/", desc:"ยืม-คืนครุภัณฑ์ และติดตามสถานะการยืม", cat:"ครุภัณฑ์", icon:"229-arrow-exchange", internal:true},
    {name:"บัญชีรายการวัสดุคอมพิวเตอร์", url:"http://10.100.31.31/wadsadu-com/", desc:"บัญชีรายการวัสดุคอมพิวเตอร์คงเหลือและการเบิกจ่าย", cat:"ครุภัณฑ์", icon:"2450-invoice-general", internal:true},
    {name:"ระบบขอสนับสนุนสื่อประชาสัมพันธ์", url:"https://media-alc.vercel.app", desc:"ขอสนับสนุนสื่อประชาสัมพันธ์ (กำลังพัฒนา)", cat:"ทั่วไป", icon:"2873-megaphone", embed:true},
    {name:"NAS Datacenter", url:"http://10.100.31.34:1798/#/signin", desc:"พื้นที่จัดเก็บข้อมูลกลางของหน่วยงาน เข้าใช้งานผ่านบัญชีผู้ใช้", cat:"ศูนย์ข้อมูล", icon:"1310-nas-server", internal:true},
    {name:"ระบบรวมข่าวอุบัติเหตุเมาแล้วขับ", url:"https://alc-new-coral.vercel.app/", desc:"รวมข่าวอุบัติเหตุจากการเมาแล้วขับจากสื่อต่าง ๆ", cat:"ข่าว", icon:"868-car-crash", embed:true}
    /* ↓ เพิ่มระบบใหม่ต่อจากบรรทัดนี้ได้เลย (อย่าลืมใส่ , ปิดท้ายบรรทัดก่อนหน้า)
       แล้วรัน bash tools/build-icons.sh เพื่อสร้างไฟล์ไอคอน
       (ค่า icon ในบรรทัดตัวอย่างต้องเป็นชื่อไอคอนที่มีจริง เพราะสคริปต์อ่านบรรทัดนี้ด้วย)
    ,{name:"ชื่อระบบใหม่", url:"https://example.com", desc:"คำอธิบาย", cat:"หมวดหมู่", icon:"28-calendar", embed:true}
    */
  ];

  var MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

  var activeCat = "ทั้งหมด";
  var query = "";
  var installEvent = null;

  var grid    = document.getElementById("grid");
  var chipsEl = document.getElementById("chips");

  function esc(t){ var d=document.createElement("div"); d.textContent = t==null?"":t; return d.innerHTML; }
  function iconSrc(s, ext){
    var n = s && s.icon;
    if(typeof n !== "string" || !/^[a-z0-9-]+$/i.test(n)) return "";  /* กันชื่อแปลก/path traversal */
    return ICON_DIR + n + ext;
  }
  function isEmbed(s){ return !!s.embed && OPEN_MODE !== "newtab"; }

  /* ---------- filter chips ---------- */
  function cats(){
    var out = ["ทั้งหมด"];
    SYSTEMS.forEach(function(s){ if(s.cat && out.indexOf(s.cat) < 0) out.push(s.cat); });
    return out;
  }
  function renderChips(){
    chipsEl.innerHTML = "";
    cats().forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (c === activeCat ? " on" : "");
      b.textContent = c;
      b.onclick = function(){ activeCat = c; renderChips(); renderGrid(); };
      chipsEl.appendChild(b);
    });
  }

  /* ---------- grid ---------- */
  function matches(s){
    var okCat = activeCat === "ทั้งหมด" || s.cat === activeCat;
    var q = query.trim().toLowerCase();
    var okQ = !q || (s.name + " " + (s.desc||"") + " " + (s.cat||"")).toLowerCase().indexOf(q) > -1;
    return okCat && okQ;
  }
  function iconMarkup(s){
    var gif = iconSrc(s, ".gif");
    if(!gif) return "";
    return '<img src="' + esc(gif) + '" alt="" width="' + ICON_PX + '" height="' + ICON_PX +
           '" loading="eager" decoding="async">';
  }
  var cards   = null;   /* <div class="cw"> 1 ใบต่อ 1 ระบบ — สร้างครั้งเดียวตลอดอายุหน้า */
  var emptyEl = null;

  /* =========================================================
     ติดดาว "ระบบที่ใช้บ่อย" → เด้งขึ้นไปอยู่ด้านบนสุด
     เก็บใน localStorage ของเบราว์เซอร์แต่ละคน ไม่ปนกันระหว่างผู้ใช้
     และไม่ตามไปเครื่องอื่น (ถ้าต้องการให้ตามตัว ต้องมีระบบล็อกอิน+เซิร์ฟเวอร์)
     ========================================================= */
  var FAV_KEY = "alc-hub-fav";
  var favs = (function(){
    try{
      var v = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
      return Array.isArray(v) ? v.filter(function(x){ return typeof x === "string"; }) : [];
    }catch(e){ return []; }        /* ค่าเสีย/อ่านไม่ได้ = เริ่มจากว่าง ไม่ให้หน้าพัง */
  })();
  function favId(s){ return s.url || s.name; }
  function isFav(s){ return favs.indexOf(favId(s)) > -1; }
  function saveFavs(){
    try{ localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }
    catch(e){}                     /* โหมดส่วนตัว/พื้นที่เต็ม = ใช้ได้แค่รอบนี้ ไม่ต้องเตือน */
  }

  var STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="m12 3.6 2.63 5.33 5.87.86-4.25 4.14 1 5.85L12 16.97l-5.25 2.77 1-5.85L3.5 9.79l5.87-.86z"' +
    ' stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function paintFav(btn, s){
    var on = isFav(s);
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    var t = on ? "เอาออกจากระบบที่ใช้บ่อย" : "ติดดาวเป็นระบบที่ใช้บ่อย";
    btn.title = t;
    btn.setAttribute("aria-label", t + ": " + s.name);
  }
  function toggleFav(s, btn){
    var id = favId(s), k = favs.indexOf(id);
    if(k > -1) favs.splice(k, 1); else favs.push(id);
    saveFavs(); paintFav(btn, s); applyOrder();
  }
  /* ดันการ์ดที่ติดดาวขึ้นบนด้วย CSS order — ไม่ย้าย DOM
     (ย้าย DOM = <img> ถูกแนบใหม่ GIF จะเด้งกลับไปเริ่มเฟรมแรก) */
  function applyOrder(){
    if(!cards) return;
    for(var i = 0; i < cards.length; i++){
      cards[i].style.order = isFav(SYSTEMS[i]) ? "-1" : "0";
    }
  }

  function buildCard(s, i){
    var embed = isEmbed(s);
    var cw = document.createElement("div");
    cw.className = "cw";
    cw.style.animationDelay = (0.045 * i).toFixed(3) + "s";
    var a = document.createElement("a");
    a.className = "card";
    a.href = s.url || "#";
    if(!embed && s.url && s.url !== "#"){ a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML =
      '<div class="card-top">' +
        '<div class="icon">' + iconMarkup(s) + '</div>' +
        '<div class="tags">' +
          (s.cat ? '<span class="cat-tag">' + esc(s.cat) + '</span>' : '') +
          (s.internal ? '<span class="internal"><i></i>เครือข่ายภายใน</span>' : '') +
        '</div>' +
      '</div>' +
      '<h3>' + esc(s.name) + '</h3>' +
      '<p>' + esc(s.desc || "") + '</p>' +
      '<div class="card-foot">' +
        '<span class="open-label">' + (embed ? "เปิดในหน้านี้" : "เปิดแท็บใหม่") + '</span>' +
        '<span class="go">เข้าระบบ <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
      '</div>';
    if(!s.url || s.url === "#"){
      a.onclick = function(ev){ ev.preventDefault(); };
    } else if(embed){
      a.onclick = function(ev){ ev.preventDefault(); openViewer(s); };
    }

    var fav = document.createElement("button");
    fav.type = "button";
    fav.className = "fav";
    fav.innerHTML = STAR_SVG;
    paintFav(fav, s);
    fav.onclick = function(ev){
      ev.preventDefault(); ev.stopPropagation();   /* กดดาวแล้วต้องไม่เปิดระบบ */
      toggleFav(s, fav);
    };

    cw.appendChild(a);
    cw.appendChild(fav);
    return cw;
  }

  /* สร้างการ์ดครั้งเดียว ห้ามสร้างใหม่ตอนค้นหา/กดหมวด
     ไม่งั้น <img> ถูกสร้างใหม่ = GIF เด้งกลับไปเริ่มเฟรมแรกทุกครั้งที่พิมพ์ */
  function mountGrid(){
    grid.innerHTML = "";
    cards = SYSTEMS.map(function(s, i){
      var cw = buildCard(s, i);
      grid.appendChild(cw);
      return cw;
    });
    emptyEl = document.createElement("div");
    emptyEl.className = "empty";
    emptyEl.innerHTML = "<b>ไม่พบระบบที่ตรงกับการค้นหา</b>ลองเปลี่ยนคำค้นหรือเลือกหมวดหมู่อื่น";
    emptyEl.hidden = true;
    emptyEl.style.order = "1";     /* อยู่ท้ายสุดเสมอ ไม่ให้แทรกกลางการ์ดที่ติดดาว */
    grid.appendChild(emptyEl);
    document.getElementById("count").textContent = String(SYSTEMS.length).padStart(2,"0");
    applyOrder();
  }

  /* ค้นหา/กรอง = ซ่อน-แสดงการ์ดเดิมเท่านั้น (ไม่แตะ DOM ของไอคอน) */
  function renderGrid(){
    if(!cards) mountGrid();
    var shown = 0;
    for(var i = 0; i < cards.length; i++){
      var ok = matches(SYSTEMS[i]);
      cards[i].hidden = !ok;
      if(ok) shown++;
    }
    emptyEl.hidden = shown > 0;
  }

  document.getElementById("search").addEventListener("input", function(e){
    query = e.target.value; renderGrid();
  });

  /* ---------- clock / date ---------- */
  var live = document.getElementById("live");
  if(!SHOW_CLOCK){ live.hidden = true; }
  function tick(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,"0"); };
    if(SHOW_CLOCK){
      document.getElementById("clock").textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }
    document.getElementById("date").textContent = d.getDate() + " " + MONTHS[d.getMonth()] + " " + ((d.getFullYear() + 543) % 100);
  }

  /* ---------- embed viewer ---------- */
  var viewer = document.getElementById("viewer");
  var vFrame = document.getElementById("vFrame");
  var vLoad  = document.getElementById("vLoad");

  function openViewer(s){
    document.getElementById("vName").textContent = s.name;
    document.getElementById("vUrl").textContent  = s.url;
    document.getElementById("vIcon").innerHTML   = iconMarkup(s);
    document.getElementById("vOpen").href = s.url;
    vLoad.style.display = "grid";
    vFrame.src = s.url;
    viewer.classList.add("open");
    viewer.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
  }
  function closeViewer(){
    viewer.classList.remove("open");
    viewer.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
    vFrame.src = "about:blank";
  }
  vFrame.addEventListener("load", function(){
    if(vFrame.src && vFrame.src.indexOf("about:blank") === -1) vLoad.style.display = "none";
  });
  document.getElementById("vClose").addEventListener("click", closeViewer);
  viewer.addEventListener("click", function(e){ if(e.target === viewer) closeViewer(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && viewer.classList.contains("open")) closeViewer();
  });

  /* ---------- PWA: install banner + service worker ---------- */
  var installEl = document.getElementById("install");
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    installEvent = e;
    if(SHOW_INSTALL) installEl.hidden = false;
  });
  document.getElementById("installYes").addEventListener("click", function(){
    if(!installEvent) return;
    installEvent.prompt();
    installEvent.userChoice.then(function(){ installEvent = null; installEl.hidden = true; });
  });
  document.getElementById("installNo").addEventListener("click", function(){ installEl.hidden = true; });

  if("serviceWorker" in navigator){
    if(location.protocol === "https:"){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    } else {
      /* ตอนทดสอบบนเครื่อง (http/localhost) ไม่ใช้ service worker และถอนตัวที่เคยติดตั้งไว้ออก
         เพราะ SW เก็บไอคอนแบบ cache-first — แก้ไฟล์แล้วเบราว์เซอร์จะยังเห็นของเก่า */
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ r.unregister(); });
      }).catch(function(){});
      if(window.caches && caches.keys){
        caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
      }
    }
  }

  renderChips(); renderGrid(); tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
